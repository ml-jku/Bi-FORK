[project]
name = "bifurcation"
version = "0.1.0"
description = "Project using PyTorch Geometric and CUDA 13.2"
requires-python = ">=3.12.0,<3.14"
dependencies = [
    "torch==2.12.1+cu132",
    "torchvision==0.27.1+cu132",
    "torch-geometric==2.6.1",
    "torch-scatter",
    "torch-sparse",
    "torchdata==0.7.1",
    "torchmetrics==1.7.0",
    "torchdiffeq==0.2.5",
    "torchfsm==0.0.3",
    "torchinfo==1.8.0",
    "nvidia-cuda-nvcc==13.2.*",
    "heavyball>=2.2.1",
    "bitsandbytes>=0.41.0",
    "numpy",
    "scipy",
    "pandas",
    "h5py",
    "h5pickle",
    "scikit-learn",
    "tsnecuda",
    "umap-learn",
    "lightning",
    "lightning-utilities",
    "einops",
    "kappamodules",
    "timm",
    "hydra-core",
    "omegaconf",
    "rootutils",
    "easydict",
    "dash",
    "matplotlib",
    "plotly",
    "kaleido",
    "pillow",
    "rich",
    "wandb",
    "joblib",
    "tqdm",
    "jupyter",
    "ipykernel",
    "ipywidgets",
    "nbformat",
    "azula>=0.11.1",
    "altair>=6.1.0",
    "ipympl>=0.10.0",
    "monai==1.6.0",
]
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.12.1+cu132.html"
explicit = true
format = "flat"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torch-scatter = { index = "pyg" }
torch-sparse = { index = "pyg" }

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch==2.12.1+cu132"]
torch-sparse = ["torch==2.12.1+cu132"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: spawns a subprocess or trains; skip with -m 'not slow'"]
