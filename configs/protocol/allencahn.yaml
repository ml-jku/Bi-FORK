# @package _global_
seed: 42

protocol:
  n_samples: 2
  n_trials: 8
  num_steps: 50
  first_scored_frame: 1

  max_abs_distance: null
  max_rel_distance: null
  min_fraction: 0.0

  # Nearest-rollout distance for matching a trial to its branch
  distance_metric: fft_mse

  n_modes: null
  vary_context_rollout: true
  label:
    _target_: bifurcation.metrics.allencahn.label_Y
    _partial_: true
  representative_rollouts:
    _target_: bifurcation.metrics.allencahn.representative_rollouts
    _partial_: true
  reference_report:
    _target_: bifurcation.metrics.allencahn.reference_report
    _partial_: true
  relax:
    _target_: bifurcation.metrics.allencahn.relax_Y
    _partial_: true
  residual:
    _target_: bifurcation.metrics.allencahn.residual_Y
    _partial_: true
  draw:
    _target_: bifurcation.viz.allencahn.draw_mode
    _partial_: true
