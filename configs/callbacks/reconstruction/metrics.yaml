# @package callbacks
# denormalized val [last frame_]mae / [lf_]mse / [lf_]rmse / rel_l2
reconstruction_metrics:
  _target_: bifurcation.callbacks.reconstruction.ReconstructionMetrics
  n_samples: 4
  n_frames: 6
  every_n_epochs: 1
  seed: 0
  metrics:
    mae:
      _target_: bifurcation.metrics.generic.masked_mae
      _partial_: true
    mse:
      _target_: bifurcation.metrics.generic.masked_mse
      _partial_: true
    rmse:
      _target_: bifurcation.metrics.generic.masked_rmse
      _partial_: true
    rel_l2:
      _target_: bifurcation.metrics.generic.relative_l2
      _partial_: true
    rec_angle:  # rec_ prefix: val/angle is the per-batch metric of the model (normalized fields)  lang-ok
      _target_: bifurcation.metrics.generic.masked_angle
      _partial_: true
